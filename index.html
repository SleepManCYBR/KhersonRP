let lang='ru', activeFilter='all';
const rules = [{"n":1,"icon":"fa-handshake-angle","title":"Уважение, антибуллинг, личное пространство","items":[{"s":"§1.1","t":"Оскорбления, буллинг, нарушение личного пространства. Уважайте других персонажей и не используйте оскорбления как способ отыгровки RP.","p":"Предупреждение→Бан 1 день","k":"fine","e":""},{"s":"§1.2","t":"Оскорбления родственников в любой форме.","p":"Бан 7 дней (14 дней хардов, зависит от жестокости оскорблений).","k":"fine","e":""},{"s":"§1.3","t":"Упоминание родственников в негативном, оскорбительном, провокационном ключе, а также любые завуалированные намёки в их сторону.","p":"Бан 3–5 дней (6-10 хардов, зависит от оскорблений).","k":"fine","e":""},{"s":"§1.4","t":"Угрозы расправой, нанесением вреда жизни или здоровью в реальной жизни.","p":"Бан 3-5 дней (6-10 дней хардов, зависит от серьезности угроз).","k":"fine","e":""},{"s":"§1.5","t":"Пропаганда, разжигание межнациональной, религиозной или политической розни (включая политическую символику, номера и обсуждение острых конфликтов).","p":"Бан 5 дней (14 дней хардов, зависит от ситуации).","k":"fine","e":""},{"s":"§1.6","t":"Включение гимнов любых государств (как существующих, так и исторических / прекративших существование) в голосовой чат или через саундпады.","p":"Бан 7 дней (14 дней хардов, зависит от того, какие гимны были включены).","k":"fine","e":""},{"s":"§1.7","t":"Целенаправленная травля (буллинг) и преследование (сталкинг) конкретного игрока с целью испортить ему игровой процесс или вывести на эмоции.","p":"Бан 1-3 дней","k":"fine","e":""},{"s":"§1.8","t":"Массовый буллинг — коллективное унижение, травля или издевательства над одним игроком группой лиц.","p":"Бан 3 дней каждому участнику","k":"fine","e":""},{"s":"§1.9","t":"Докс — поиск, слив или угроза публикации личных данных игрока (фотографий, адреса, номера телефона, соцсетей) без его согласия.","p":"Перманентный бан(За фото). За остальное ЧСП","k":"severe","e":""},{"s":"§1.10","t":"Дискриминация игроков по возрасту, голосу или особенностям речи (высмеивание акцента, дефектов дикции, писклявого/грубого голоса).","p":"Предупреждение→Бан 1-3 дней","k":"fine","e":""},{"s":"§1.11","t":"Провокация игроков на нарушение правил (байт на оскорбления, агрессию или OOC-конфликт).","p":"Предупреждение→Бан 1-2 день","k":"fine","e":""},{"s":"§1.12","t":"Пожелание смерти, тяжёлых болезней или несчастий игроку или его близким в любой форме.","p":"Бан 7 дней (14 дней хардов, зависит от жестокости пожеланий).","k":"fine","e":""},{"s":"§1.13","t":"Вмешательство в чужой закрытый RP-диалог или сцену с целью троллинга, криков и срыва атмосферы.","p":"Предупреждение→Бан 1-3 Дня","k":"fine","e":""},{"s":"§1.14","t":"Публичные призывы к травле, массовым репортам или бойкоту конкретного игрока без каких-либо нарушений с его стороны.","p":"Бан 1-3 дней","k":"fine","e":""},{"s":"§1.15","t":"Оскорбление и унижение игроков по причине их принадлежности к определённой фракции в OOC-пространстве и не только.","p":"Предупреждение→Бан 1 день","k":"fine","e":""},{"s":"§1.16","t":"Использование непристойных, провокационных или унижающих анимаций по отношению к другим игрокам (особенно к тем, кто находится в наручниках или ранен).","p":"Предупреждение→Бан 1 день","k":"fine","e":""}]},{"n":2,"icon":"fa-car","title":"ПДД и правила использования транспорта","items":[{"s":"§2.1","t":"Намеренный таран других транспортных средств без веской причины.","p":"Предупреждение→Бан 1-2 дня","k":"fine","e":""},{"s":"§2.2","t":"Езда с пробитыми колёсами (от 2–3 повреждённых колёс) на высокой скорости.","p":"Предупреждение→Бан 1 день","k":"fine","e":""},{"s":"§2.3","t":"Заезд в тюнинг для покраски, починки во время активной погони или перестрелки с целью мгновенно починить авто.","p":"Бан 1–2 дня","k":"fine","e":""},{"s":"§2.4","t":"Езда на скутерах при наличии розыска или во время ухода от полиции.","p":"Бан 1 день","k":"fine","e":""},{"s":"§2.6","t":"Намеренная езда по встречной полосе на трассах и мостах с целью создания лобовых столкновений и помех игрокам.","p":"Бан 1 день","k":"fine","e":""},{"s":"§2.8","t":"Массовый таран толпы игроков или скопления машин на парковках, мероприятиях и тому подобного.","p":"Бан 1-5 дней","k":"fine","e":""},{"s":"§2.9","t":"Использование сельскохозяйственного транспорта в городе.","p":"Предупреждение→Бан 1 день","k":"fine","e":""},{"s":"§2.10","t":"Намеренный уход от погони в воду (утопление себя или автомобиля, чтобы избежать задержания).","p":"Бан 2–3 дня","k":"fine","e":""},{"s":"§2.11","t":"Продолжение движения на автомобиле после тяжёлого лобового столкновения.","p":"Бан 2-3 дня","k":"fine","e":""},{"s":"§2.12","t":"Намеренное включение громкой музыки, саундпадов в автомобиле в людных местах с целью мешать другим игрокам.","p":"Предупреждение→Бан 1-3 дня","k":"fine","e":""},{"s":"§2.13","t":"Намеренное подрезание по пингу (использование задержки интернета для того, чтобы выбить чужую машину).","p":"Бан 1-3 дня","k":"fine","e":""},{"s":"§2.14","t":"Беспричинный таран и скидывание в воду пустых припаркованных автомобилей.","p":"Предупреждение+Кик→Бан 1 день","k":"fine","e":""},{"s":"§2.15","t":"Помеха работе дальнобойщиков и автобусников (намеренное блокирование маршрута, подрезание прицепов).","p":"Предупреждение→Бан 1–2 дня","k":"fine","e":""},{"s":"§2.16","t":"Игнорирование административных предупреждений о необходимости убрать мешающий транспорт с проезжей части или спавна.","p":"Кик→Бан 1 день","k":"fine","e":""}]},{"n":3,"icon":"fa-lock","title":"Зелёные зоны (Green Zone)","items":[{"s":"§3.1","t":"Нахождение с оружием в руках в зелёной зоне. ИСКЛЮЧЕНИЕ: для гос. фракций.","p":"Бан 1 день","k":"fine","e":""},{"s":"§3.2","t":"Провокация на конфликт, убийство или нанесение любого урона игрокам в зелёной зоне.","p":"Бан 3-5 дня","k":"fine","e":""},{"s":"§3.3","t":"Использование холодного/огнестрельного оружия в зелёной зоне.","p":"Бан 1-7дней","k":"fine","e":""},{"s":"§3.4","t":"Находиться в маске/скрывать лицо в зеленой зоне.","p":"Бан 1 день","k":"fine","e":""},{"s":"§3.5","t":"Использование пиротехники в зелёных зонах.","p":"Перманентный бан","k":"severe","e":""},{"s":"§3.6","t":"Прицеливание из огнестрельного оружия в сторону игроков или транспорта в зелёной зоны.","p":"Бан 12 часов-1 день","k":"fine","e":""},{"s":"§3.7","t":"Бросание светошумовых гранат в зелёной зоне","p":"Бан 6 часов-2 дня","k":"fine","e":""},{"s":"§3.8","t":"Массовые драки и беспорядки на территории зелёной зоны (участие 3 и более человек).","p":"Бан 2–3 дня каждому участник","k":"fine","e":""}],"image":"https://files.catbox.moe/rdp96q.png","legend":[{"icon":"fa-lock","color":"#3ddc73","tt":"Зелёные зоны"},{"shape":"outline","color":"#3ddc73","fill":"#ff3b3b","tt":"Приватная территория (зелёная обводка + красное заполнение)"},{"icon":"fa-burst","color":"#3ea6ff","tt":"Ивентовые зоны"},{"icon":"fa-house","color":"#ff9a3d","tt":"Руф-кемп зоны"},{"icon":"fa-satellite-dish","color":"#8a2f3a","shape":"circle","tt":"Зоны, где разрешены радары"}]},{"n":4,"icon":"fa-scale-balanced","title":"RP-термины и наказания","items":[{"s":"§4.1","t":"DM (DeathMatch) — нанесение урона или убийство без  IC-причины (от 2 ударов).","p":"Бан 1–3 дня","k":"fine","e":""},{"s":"§4.2","t":"DB (DriveBy) — намеренный наезд или таран.","p":"Бан 2 дня","k":"fine","e":""},{"s":"§4.3","t":"RDM (Random DeathMatch) — масовый DM.","p":"Бан 5–10 дней (10-20 дней хардов, зависит от ситуации).","k":"fine","e":""},{"s":"§4.4","t":"RK (Revenge Kill) — возвращение на место своей смерти с целью отомстить игроку.","p":"Бан 1-3 дня","k":"fine","e":""},{"s":"§4.5","t":"PG (PowerGaming) — преувеличение физических возможностей своего персонажа.","p":"Бан 1-3 дня","k":"fine","e":""},{"s":"§4.6","t":"Fear RP — отсутствие страха за свою жизнь при прямой угрозе.","p":"Бан 1-3 дня","k":"fine","e":""},{"s":"§4.7","t":"Fail RP — нереалистичное поведение персонажа, противоречащее логике, здравому смыслу или нормам реальной жизни.","p":"Бан 1–5 дней","k":"fine","e":""},{"s":"§4.8","t":"Combat Logging — выход из игры во время активной RP-ситуации, погони, задержания или перестрелки.","p":"Бан 10 дней","k":"fine","e":""},{"s":"§4.9","t":"MG (MetaGaming) — использование OOC информации в IC.","p":"Бан 1-2 дня","k":"fine","e":""},{"s":"§4.10","t":"Уход от RP — намеренное игнорирование RP-отыгровок других игроков, отказ от взаимодействия в RP-ситуации или уход в AFK без выхода из игры.","p":"Бан 2–3 дня","k":"fine","e":""},{"s":"§4.11","t":"CopBaiting — намеренная провокация сотрудников полиции и гос. структур (таран патрульных авто, оскорбления в упор) с целью вызвать погоню или перестрелку без RP-мотива.","p":"Бан 2-3 дня (4-6 дней хардов, зависит от количества).","k":"fine","e":""},{"s":"§4.12","t":"Убийство AFK-персонажа — нанесение урона, убийство, который отошёл от компьютера и не участвует в игровом процессе.","p":"Бан 2 дня","k":"fine","e":""},{"s":"§4.13","t":"NRP Inventory — хранение и использование предметов в инвентаре в обход логики реальной жизни (например, ношение нескольких автоматов или крупногабаритных вещей в карманах; исключение: печеньки, какао, яблоки, энергетики).","p":"Бан 1–3 дня","k":"fine","e":""},{"s":"§4.14","t":"DelayRP — намеренное затягивание RP-процесса без веской IC-причины (лимит на суд / досудебное — до 1 часа, на остальные RP-ситуации — до 20 минут).","p":"Бан 1–2 дня","k":"fine","e":""},{"s":"§4.15","t":"NonRP Behavior — обесценивание ценного имущества (например, намеренный таран столбов и знаков на дорогом автомобиле ради развлечения).","p":"Бан 2 дня","k":"fine","e":""},{"s":"§4.16","t":"ERP (Erotic RolePlay) — отыгровка действий сексуального, интимного или эротического характера в любом виде.","p":"Бан 7 дней","k":"fine","e":""},{"s":"§4.17","t":"NonRP Heal — использование печенек, яблок для восстановления здоровья без RP-отыгровки или непосредственно во время активной перестрелки/драки.","p":"Бан 2 дня","k":"fine","e":""},{"s":"§4.18","t":"NonRP Cop - действия сотрудника полиции, нарушающие логику RP или правила гос. структур.","p":"Бан 3 дня","k":"fine","e":""},{"s":"§4.19","t":"NonRP Drive — нереалистичное управление транспортным средством (езда на спорткарах по горам и бездорожью, езда на высокой скорости с пробитыми колёсами).","p":"Бан 2 дня","k":"fine","e":""},{"s":"§4.20","t":"Combat Medic — оказание медицинской помощи игроку во время активной перестрелки.","p":"Бан 2 дня","k":"fine","e":""},{"s":"§4.21","t":"BH (BunnyHop) — прыжки во время движения для уклонения от пуль или выстрелов тайзера.","p":"Бан 3 дня","k":"fine","e":""},{"s":"§4.23","t":"TK (Team Kill) — намеренное нанесение урона или убийство участников своей фракции, банды или команды","p":"Бан 2 дня","k":"fine","e":""},{"s":"§4.24","t":"SK (Spawn Kill) — убийство или нанесение урона игроку на месте его появления.","p":"Бан 2 дня","k":"fine","e":""},{"s":"§4.25","t":"Bypass Ban — обход блокировки аккаунта любыми способами.","p":"Перманентный бан","k":"severe","e":""},{"s":"§4.26","t":"Bodyblock — намеренное блокирование движения игрока или транспорта своим персонажем","p":"Бан 2 дня","k":"fine","e":""},{"s":"§4.27","t":"NonRP Cuff — надевание наручников на бегу/во время активного передвижения, засчитывается как PowerGaming.","p":"Бан 2 дня","k":"fine","e":""},{"s":"§4.28","t":"NLR(New Life Rule) - возвращение на точку смерти игрока(Таймер на это правило 20-30 минут), а после лечения медиком игрок находиться в шоковом состоянии 5-7 минут.","p":"Бан 2-3 дня","k":"fine","e":""},{"s":"§4.29","t":"Repeat Kill - намеренное повторное убийство одного и того же игрока.","p":"Бан 2-3 дня","k":"fine","e":""}]},{"n":5,"icon":"fa-user","title":"Внешний вид / Аватары","items":[{"s":"§5.1","t":"Оскорбительные скины, форма спецслужб для тех, кто не состоит во фракции, а также крупногабаритные скины.","p":"Предупреждение+Кик→Бан 2 дня","k":"fine","e":""},{"s":"§5.2","t":"Скины животных или несуществующих существ без качественной RP-отыгровки.","p":"Предупреждение+Кик→Бан 5 дней","k":"fine","e":""},{"s":"§5.3","t":"Скины, футболки и аксессуары с запрещённой политической символикой, флагами и знаками.","p":"Предупреждение+Кик→Перманентный бан","k":"severe","e":""},{"s":"§5.4","t":"Спец. службы и их формы — запрещено носить формы с какими-либо сторонними флагами, символами, повязками или гербами (исключение: украинский флаг, символы, знаки и тому подобное).","p":"Предупреждение+Кик→Перманентный бан","k":"severe","e":""},{"s":"§5.5","t":"Использование мини-аватаров, карликовых бандлов и багованных ног/торсов.","p":"Предупреждение+Кик→Бан 2 дня","k":"fine","e":""},{"s":"§5.6","t":"Ношение на аватаре элементов одежды или аксессуаров с контентом 18+, кровью или расчленёнкой.","p":"Предупреждение+Кик→Бан 7 дней (14 дней хардов, зависит от изображений).","k":"fine","e":""},{"s":"§5.7","t":"Систематическое игнорирование требований администрации сменить несоответствующий правилам аватар после предупреждения или кика.","p":"Бан 1-3 дней","k":"fine","e":""}]},{"n":6,"icon":"fa-user-shield","title":"Отношение к Администрации","items":[{"s":"§6.1","t":"Оскорбление администрации — хамство и оскорбления админа в OOC / Войсе / Discord / Telegram / В любых чатах.","p":"3 дня","k":"fine","e":""},{"s":"§6.2","t":"Неуважение и оскорбление родных администрации — любые прямые или завуалированные упоминания, оскорбления и провокации в сторону родственников или близких администратора в любых чатах, войсе и соцсетях проекта.","p":"10 дней (20 дней хардов, зависит от жестокости оскорблений).","k":"fine","e":""},{"s":"§6.3","t":"Неуважение и помеха работе — перебивание, хамство, провокации и всему подобное.","p":"От 1 до 3 дней","k":"fine","e":""},{"s":"§6.4","t":"Неподчинение требованиям администрации — игнорирование или прямой отказ выполнять законные OOC-указания администратора (Например, прекратить NonRP действия, предоставить откат, сменить NonRP скин).","p":"От 2 до 4 дней","k":"fine","e":""},{"s":"§6.5","t":"Угрозы в адрес администрации — угрозы расправой в реале, доксом, деаноном, вредом серверу и всему подобному.","p":"Бан от 14 дней до ЧСП","k":"severe","e":""},{"s":"§6.6","t":"Обман администрации — ложь, скрытие фактов или подделка доказательств (скринов / откатов).","p":"Бан 7 дней","k":"fine","e":""},{"s":"§6.7","t":"Вмешательство в разборки третьих лиц/помеха проведению админ-разборок (стрельба, влезание в диалог и всему подобное).","p":"Бан от 3 до 7 дней","k":"fine","e":""},{"s":"§6.8","t":"Выход с игры во время разбирательства с администрацией (Админ обязан подождать 10 минут, только если человек за это время не зашел обратно банить, либо же отписать админу причину выхода).","p":"Бан 7 дней","k":"fine","e":""},{"s":"§6.9","t":"Игнорирование требования администрации освободить зону проведения разборок (для посторонних игроков, стоящих рядом и подслушивающих).","p":"Кик→Бан от 12 часов до 2 дня","k":"fine","e":""},{"s":"§6.10","t":"Создание твинков с оскорбительными никнеймами в адрес конкретных администраторов проекта.","p":"Перманентный бан","k":"severe","e":""},{"s":"§6.11","t":"Дискриминация, высмеивание голоса, возраста, акцента или особенностей администратора.","p":"Бан 3–5 дней","k":"fine","e":""},{"s":"§6.12","t":"Самовольный уход с места проведения разборок (убегание, уезд на транспорте и тому подобное).","p":"Бан 3–5 дней","k":"fine","e":""},{"s":"§6.13","t":"Попытка шантажа администратора (угрозы сливом переписок, жалобой руководству или публикацией старых материалов ради выгоды).","p":"Бан от 14 дней до ЧСП","k":"severe","e":""},{"s":"§6.14","t":"Преследование (сталкинг) администратора по карте во время его работы (наблюдения за игроками, разбора репортов), мешающее оставаться незаметным.","p":"Предупреждение→Бан 1-3 дня","k":"fine","e":""}]},{"n":7,"icon":"fa-microphone","title":"Голосовой чат и рация","items":[{"s":"§7.1","t":"Использование ПО для изменения голоса.","p":"Бан 5 дней","k":"fine","e":""},{"s":"§7.2","t":"Посторонние громкие звуки, музыка без согласия.","p":"Бан 3 дня","k":"fine","e":""},{"s":"§7.3","t":"Перебивание, создание шума и помех в голосовом чате.","p":"Бан 2 дня","k":"fine","e":""},{"s":"§7.4","t":"Использование Soundpad, программных звуковых эффектов, скримеров и резких звуков в войс-чате или рации.","p":"Бан 2–3 дня","k":"fine","e":""},{"s":"§7.5","t":"Использование служебной рации в бессознательном состоянии персонажа, а также находясь в наручниках или в плену.","p":"Бан 1–2 дня","k":"fine","e":""},{"s":"§7.6","t":"Включение нацистских речей, запрещённых лозунгов или аудиоматериалов экстремистского характера в голосовой чат или рацию.","p":"Перманентный бан и возможный ЧСП","k":"severe","e":""},{"s":"§7.7","t":"Высмеивание дефектов речи, акцента, возраста или голоса других игроков в рации.","p":"Бан 2–5 дней (4-10 дней хардов, зависит от жестокости высмеиваний).","k":"fine","e":""},{"s":"§7.8","t":"Использование голосового чата в бессознательном состоянии (разговоры находясь в критическом состоянии, подсказки друзьям).","p":"Бан 1–2 дня","k":"fine","e":""},{"s":"§7.9","t":"Помеха проведению собеседований, строёв, судов и государственных мероприятий путём включения микрофона и создания шума рядом с местом проведения.","p":"Кик→Бан 1–2 дня","k":"fine","e":""},{"s":"§7.10","t":"Постоянный фоновый шум из микрофона (неисправный микрофон, громкий телевизор, разговоры на фоне) при игнорировании просьб выключить микрофон.","p":"Предупреждение→Кик→Бан 1-3 дня","k":"fine","e":""},{"s":"§7.11","t":"Передача OOC-информации (MetaGaming) в служебную рацию (обсуждение админов, репортов, реальной жизни, жалоб и всего прочего).","p":"Предупреждение+Кик→Бан 2-3 дня","k":"fine","e":""},{"s":"§7.12","t":"Использование служебной рации не по назначению — флуд, беседы на личные темы, шутки и в общем оффтоп в служебной рации.","p":"Предупреждение+Кик→Бан от 12 часов до 2 дней","k":"fine","e":""},{"s":"§7.13","t":"Оскорбления, унижения и травля игроков в голосовом чате или рации на почве национальности, расы, религии или языка общения.","p":"Бан 7–14 дней (14-20 дней хардов, зависит от жестокости происходящего).","k":"fine","e":""},{"s":"§7.14","t":"Включение аудиозаписей с контентом 18+, стонами, порнографическим или шокирующим звуковым сопровождением в голосовой чат.","p":"Бан 7–14 дней (14-20 дней хардов, зависит от контента).","k":"fine","e":""}]},{"n":8,"icon":"fa-people-group","title":"Тиминг","items":[{"s":"§8.1","t":"Гражданскому запрещено садиться на охраняемое / служебное место.","p":"Бан 1-3 дня","k":"fine","e":""},{"s":"§8.2","t":"Сотрудникам полиции запрещается иметь какие-либо контакты, договорённости или сотрудничество с криминальными фракциями и обычными криминальными лицами. ИСКЛЮЧЕНИЕ: НЕТ.","p":"Бан 1-3 дня","k":"fine","e":""},{"s":"§8.3","t":"Гражданским лицам запрещается оказывать содействие сотрудникам правоохранительных органов.","p":"Бан 1-5 дней","k":"fine","e":""},{"s":"§8.4","t":"Запрещено совместно с криминальными лицами участвовать в перестрелках, погонях и других RP-ситуациях против третьих лиц.","p":"Бан 2-4 дня","k":"fine","e":""},{"s":"§8.5","t":"Запрещается во время погони садиться в транспортное средство к человеку, который не находится в розыске.","p":"Бан 1-3 дня","k":"fine","e":""},{"s":"§8.6","t":"Присутствие и пассивное наблюдение за нарушением игрока без попытки пресечь нарушение, находясь в одной тиме с нарушителем (соучастие).","p":"Бан 1–2 дня","k":"fine","e":""},{"s":"§8.7","t":"Намеренное игнорирование нарушений со стороны своего напарника по тимингу (например, полицейский видит, как его друг-гражданский убивает человека или грабит, но никак не реагирует).","p":"Бан 2–3 дня","k":"fine","e":""},{"s":"§8.8","t":"Запрещено брать в заложники или похищать сотрудников собственной фракции/команды ради выкупа или шутки.","p":"Бан 2–3 дня","k":"fine","e":""}]},{"n":9,"icon":"fa-user-lock","title":"Правила похищений","items":[{"s":"§9.1","t":"Похищение осуществляется строго от двух человек и более (Похищением считается когда человека посадили в автомобиль не по его воле).","p":"Бан 1 день","k":"fine","e":""},{"s":"§9.2","t":"Отсутствие вызова переговорщика на место похищения (или отказ от ведения переговоров с гос. структурами).","p":"Бан 1–2 дня","k":"fine","e":""},{"s":"§9.3","t":"Запрещено требовать что-либо у самого похищенного человека (все требования выставляются исключительно переговорщику/гос. структурам).","p":"Бан 1 день","k":"fine","e":""},{"s":"§9.4","t":"Запрещено похищать самого прибывшего переговорщика.","p":"Бан 2–3 дня","k":"fine","e":""},{"s":"§9.5","t":"Запрещено совершать похищения на территории Зелёных Зон и возле.","p":"Бан 1–3 дня","k":"fine","e":""},{"s":"§9.6","t":"Похищение игроков, находящихся в AFK.","p":"Бан 2 дня","k":"fine","e":""},{"s":"§9.7","t":"Отказ похитителей отпускать заложника после того, как все требования были полностью выполнены.","p":"Бан 3–5 дней","k":"fine","e":""},{"s":"§9.8","t":"Намеренный срыв похищения посторонними игроками (третьими лицами), которые не относятся к RP сцене.","p":"Бан 1–2 дня","k":"fine","e":""},{"s":"§9.9","t":"Убийство заложника сразу после выполнения всех требований переговорщика.","p":"Бан 3–5 дней","k":"fine","e":""},{"s":"§9.10","t":"Похищение только что появившихся, с целью фарма денег, развлечения и нетолько.","p":"Бан 2–3 дня","k":"fine","e":""},{"s":"§9.11","t":"Похищение сотрудников ДСНС, HARS, дальнобойщиков или автобусников во время исполнения ими служебных обязанностей или просто работы.","p":"Бан 2–3 дня","k":"fine","e":""},{"s":"§9.12","t":"Похищение должно быть аргументированным.","p":"Бан от 12 часов до 3 дней (Зависит от ситуации)","k":"fine","e":""}]},{"n":10,"icon":"fa-key","title":"Отмычки","items":[{"s":"§10.1","t":"Снятие или попытка снятия наручников отмычкой с другого игрока во время активной перестрелки или погони.","p":"Бан 4 дня","k":"fine","e":""},{"s":"§10.2","t":"Снятие или попытка снятия наручников отмычкой с задержанного прямо в здании полицейского участка, зале суда и подобных зданиях.","p":"Бан 5-7 дней","k":"fine","e":""},{"s":"§10.3","t":"Снятие или попытка снятия наручников отмычкой с игрока, находящегося внутри служебного автомобиля полиции.","p":"Бан 2 дня","k":"fine","e":""},{"s":"§10.4","t":"Снятие или попытка снятия наручников отмычкой с игрока во время проведения процессуальных действий (обыск, допрос, зачитывание прав).","p":"Бан 3 дня","k":"fine","e":""},{"s":"§10.5","t":"Снятие или попытка снятия наручников отмычкой без качественной RP-отыгровки процесса взлома.","p":"Бан 5 дней","k":"fine","e":""},{"s":"§10.6","t":"Снятие или попытка снятия наручников с игрока на территории Зелёной Зоны.","p":"Бан 7 дней","k":"fine","e":""},{"s":"§10.7","t":"Снятие наручников через текстуры и объекты — взлом наручников через стены, закрытые двери или любые другие преграды.","p":"Бан 4 дня","k":"fine","e":""},{"s":"§10.8","t":"Снятие или попытка снятия наручников отмычкой в тяжело раненом состоянии игрока, находящегося в стадии нока (тяжёлого ранения).","p":"Бан 3 дня","k":"fine","e":""},{"s":"§10.9","t":"Снятие или попытка снятия наручников во время плавания или нахождения под водой/в воде.","p":"Бан 3 дня","k":"fine","e":""},{"s":"§10.10","t":"Снятие или попытка снятия наручников отмычкой когда оба персонажи идут/бегут.","p":"Бан 2–3 дня","k":"fine","e":""}]},{"n":11,"icon":"fa-triangle-exclamation","title":"Особые нарушения","items":[{"s":"§11.1","t":"Рейдерство (закидывание гранат/C4 на машины или по территории для нанесения урона).","p":"Перманентный бан","k":"severe","e":""},{"s":"§11.2","t":"Спам, флуд и несанкционированная реклама массовые однотипные сообщения в игровой чат, рассылка сторонних ссылок, а также любая прямая, скрытая или завуалированная реклама других RP проектов, Telegram каналов, Discord серверов.","p":"Перманентный бан","k":"severe","e":""},{"s":"§11.3","t":"Использование запрещённого ПО для получения преимущества.","p":"Перманентный бан","k":"severe","e":""},{"s":"§11.4","t":"Bug Abuse (преднамеренное использование багов игры, недоработок, механик Roblox для личной выгоды, побега или другого).","p":"Бан 1-7 дней","k":"fine","e":""},{"s":"§11.5","t":"Использование радаров без разрешения администрации.","p":"Бан 2 дня","k":"fine","e":""},{"s":"§11.6","t":"Игра без голосового чата (неподтверждённый аккаунт или регион с блокировкой войса).","p":"Кик→Перманентный бан","k":"severe","e":""},{"s":"§11.7","t":"Нахождение в труднодоступных местах (крыши, не обозначенные как руфер зоны, столбы, светофоры и все тому подобное).","p":"Предупреждение+Кик→Бан 1 день","k":"fine","e":""},{"s":"§11.8","t":"Работа без фракций.","p":"Бан 3 дня","k":"fine","e":""},{"s":"§11.9","t":"Расизм и дискриминация — любые оскорбления, унижения, использование расовых оскорблений и проявление нетерпимости по цвету кожи или происхождению.","p":"Бан 14 дней→До возможного перманентного бана","k":"severe","e":""},{"s":"§11.10","t":"Пропаганда и демонстрация фашизма, нацизма, свастики и любой экстремистской символики (в чате, голосовом чате, на скинах или через декор).","p":"Бан 30 дней хардов→До возможного ЧСП","k":"severe","e":""},{"s":"§11.11","t":"Религиозный экстремизм и оскорбление чувств верующих — намеренные насмешки, травля и агрессия на почве религии в любом виде.","p":"Бан 7-14 дней (14-20 дней хардов, зависит от жестокости оскорблений).","k":"fine","e":""},{"s":"§11.12","t":"Гомофобия, травля и призывы к расправе над игроками на почве их личной ориентации или гендерной идентичности (грубые оскорбления и буллинг).","p":"Бан 7-14 дней (14 дней хардов, зависит жестокости травли).","k":"fine","e":""},{"s":"§11.13","t":"Сватинг и ложные вызовы экстренных служб в реальной жизни против игроков или администрации проекта.","p":"ЧСП","k":"severe","e":""},{"s":"§11.14","t":"Склонение и призывы к суициду или причинению себе увечий в голосовом чате и не только.","p":"Перманентный бан/Возможный ЧСП","k":"severe","e":""},{"s":"§11.5","t":"Фрикование (неадекватное поведение, клоунада и абсурдные действия) — намеренное совершение бессмысленных, провокационных или нелогичных поступков (абсурдные выкрики, симуляция психических отклонений) целью сорвать серьёзную RP-ситуацию, привлечь внимание или просто развлечься.","p":"Предупреждение→ Бан 2-5 дней (Зависит от ситуации, а так же возможные харды (5-10 хардов))","k":"fine","e":""},{"s":"§11.6","t":"Отыгровка в свою сторону (Игра в свою пользу / Искусственное усложнение RP) — отыгровка в свою сторону с целью навязать другим игрокам выгодные только для себя условия, придумать несуществующие предметы, условия или состояние которых нет, чтобы избежать ареста, обыска, ограбления, смерти или другого.","p":"Бан 2–3 дня","k":"fine","e":""}]}];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---- snow (background layer) ---- */
(function(){
  const c=document.getElementById('snow'),x=c.getContext('2d');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  let w,h,f=[],last=0;
  function size(){
    const d=Math.min(devicePixelRatio||1,1.5);
    w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
    const n=Math.min(90,Math.round(w/16));
    while(f.length<n)f.push(mk(true));f.length=n;
  }
  function mk(any){return{x:Math.random()*w,y:any?Math.random()*h:-8,r:.8+Math.random()*1.9,v:18+Math.random()*34,p:Math.random()*6.28,a:.3+Math.random()*.5}}
  function tick(t){
    const dt=Math.min(.05,(t-last)/1000||0);last=t;
    x.clearRect(0,0,w,h);
    for(const s of f){
      s.y+=s.v*dt;s.p+=dt*.8;s.x+=Math.sin(s.p)*12*dt;
      if(s.y>h+8){Object.assign(s,mk(false));s.x=Math.random()*w}
      x.globalAlpha=s.a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();
    }
    requestAnimationFrame(tick);
  }
  size();addEventListener('resize',size);requestAnimationFrame(tick);
})();

function positionPill(instant){
  const pill=document.getElementById('pill'),a=document.querySelector('.chip.active');
  if(!a)return;
  if(instant)pill.style.transition='none';
  pill.style.width=a.offsetWidth+'px';
  pill.style.transform='translateX('+a.offsetLeft+'px)';
  if(instant)requestAnimationFrame(()=>{pill.style.transition='';});
}

let _t=null;
document.getElementById('search').addEventListener('input',()=>{clearTimeout(_t);_t=setTimeout(()=>render(false),140);});

function render(anim){
  const q=document.getElementById('search').value.trim().toLowerCase();
  let html='',shown=0;
  rules.forEach(r=>{
    const okType=activeFilter==='all'||r.items.some(x=>x.k===activeFilter);
    const hit=q===''||r.title.toLowerCase().includes(q)||r.items.some(x=>(x.s+' '+x.t+' '+x.p).toLowerCase().includes(q));
    if(!(okType&&hit))return;
    html+='<div class="rule-btn'+(anim?' anim':'')+'" data-n="'+r.n+'" style="--i:'+shown+'"><span class="num">'+r.n+'</span><i class="ico fa-solid '+r.icon+'"></i><span class="ttl">'+esc(r.title)+'</span></div>';
    shown++;
  });
  document.getElementById('grid').innerHTML=html;
  const e=document.getElementById('empty');e.style.display=shown?'none':'block';
}
document.getElementById('grid').addEventListener('click',e=>{
  const b=e.target.closest('.rule-btn');if(!b)return;
  const r=rules.find(r=>r.n==b.dataset.n);if(r)openModal(r);
});

function openModal(r){
  let h='';
  if(r.image)h+='<div class="map-img-wrap"><div class="map-loading"><div class="map-loading-icon"></div></div><img class="map-img" src="'+r.image+'" loading="lazy" decoding="async" alt="" onload="this.classList.add(\'loaded\');this.previousElementSibling.classList.add(\'hide\')" onclick="openMapZoom(this.src)"></div>';
  if(r.legend){
    h+='<div class="map-legend"><div class="legend-title"><i class="fa-solid fa-map"></i>Легенда карты</div>';
    r.legend.forEach(l=>{
      const st=l.shape==='outline'?'background:'+(l.fill||'transparent')+';border-color:'+l.color+';':'background:'+l.color+';border-color:'+l.color+';';
      h+='<div class="legend-item"><span class="legend-swatch'+(l.shape==='circle'?' circle':'')+(l.shape==='outline'?' outline':'')+'" style="'+st+'">'+(l.icon?'<i class="fa-solid '+l.icon+'"></i>':'')+'</span><span class="legend-text">'+esc(l.tt)+'</span></div>';
    });
    h+='</div>';
  }
  let k=0;
  r.items.forEach(x=>{
    if(activeFilter!=='all'&&x.k!==activeFilter)return;
    h+='<div class="item" style="--i:'+(k++)+'"><h4>'+x.s+'</h4><p>'+esc(x.t)+'</p>'
      +'<div class="expl"><span class="expl-label">Объяснение</span><div class="expl-body">'+esc(x.e)+'</div></div>'
      +'<span class="penalty '+x.k+'">НАКАЗАНИЕ: '+esc(x.p)+'</span></div>';
  });
  document.getElementById('modalTitle').textContent=r.n+'. '+r.title;
  const body=document.getElementById('modalBody');body.innerHTML=h;
  body.querySelectorAll('.map-img').forEach(mi=>{
    if(mi.complete&&mi.naturalWidth){mi.classList.add('loaded');mi.previousElementSibling.classList.add('hide');}
  });
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow='hidden';
  document.querySelector('#modal .modal-scroll').scrollTop=0;
  requestAnimationFrame(()=>{if(window.modalSliderUpdate)window.modalSliderUpdate();});
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow='';
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal').classList.contains('show')&&!document.getElementById('imgZoom').classList.contains('show'))closeModal();});

document.getElementById('filters').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');if(!chip)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');activeFilter=chip.dataset.f;
  positionPill();render(true);
});
addEventListener('resize',()=>{clearTimeout(_t);_t=setTimeout(()=>positionPill(true),100);});

(function(){
  const slider=document.getElementById('mSlider');
  const thumb=document.getElementById('mThumb');
  const scroller=document.querySelector('#modal .modal-scroll');
  if(!slider||!thumb||!scroller)return;

  let _rafPending=false;
  function update(){
    if(_rafPending)return;
    _rafPending=true;
    requestAnimationFrame(()=>{
      _rafPending=false;
      const sh=scroller.scrollHeight, ch=scroller.clientHeight, st=scroller.scrollTop;
      const overflow=sh-ch;
      if(overflow<=4){slider.classList.remove('on');return;}
      slider.classList.add('on');
      const trackH=slider.clientHeight;
      const th=Math.max(40, trackH*ch/sh);
      const maxTop=trackH-th;
      const top=(st/overflow)*maxTop;
      thumb.style.height=th+'px';
      thumb.style.transform='translateY('+top+'px)';
    });
  }
  window.modalSliderUpdate=update;
  scroller.addEventListener('scroll',update,{passive:true});
  addEventListener('resize',update);

  let dragging=false,startY=0,startScroll=0;
  thumb.addEventListener('pointerdown',e=>{
    dragging=true;thumb.classList.add('drag');
    try{thumb.setPointerCapture(e.pointerId);}catch(_){}
    startY=e.clientY;startScroll=scroller.scrollTop;e.preventDefault();
  });
  thumb.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const trackH=slider.clientHeight, th=thumb.offsetHeight;
    const overflow=scroller.scrollHeight-scroller.clientHeight;
    const maxTop=trackH-th;
    const ratio=maxTop? (e.clientY-startY)/maxTop : 0;
    scroller.scrollTop=startScroll+ratio*overflow;
  });
  function stop(){dragging=false;thumb.classList.remove('drag');}
  thumb.addEventListener('pointerup',stop);
  thumb.addEventListener('pointercancel',stop);
  slider.addEventListener('pointerdown',e=>{
    if(e.target===thumb)return;
    const rect=slider.getBoundingClientRect(), th=thumb.offsetHeight;
    const trackH=slider.clientHeight, maxTop=trackH-th;
    const overflow=scroller.scrollHeight-scroller.clientHeight;
    const ratio=Math.min(1,Math.max(0,(e.clientY-rect.top-th/2)/maxTop));
    scroller.scrollTo({top:ratio*overflow,behavior:'smooth'});
  });
})();

(function(){
  const overlay=document.getElementById('imgZoom');
  const img=document.getElementById('zoomImg');
  const hint=document.getElementById('zoomHint');
  const zoomLoading=document.getElementById('zoomLoading');
  const PAD=0.94;
  let fitScale=1,scale=1,posX=0,posY=0;
  let dragging=false,startX=0,startY=0,startPosX=0,startPosY=0;
  let pinchDist=0,pinchScale=1;

  function apply(){
    img.style.transform='translate('+posX+'px,'+posY+'px) scale('+scale+')';
    img.classList.toggle('pixel-zoom', scale > 1);
  }
  function clampScale(s){ return Math.min(fitScale*10,Math.max(fitScale,s)); }
  function centerAt(fs){
    const w=img.naturalWidth*fs, h=img.naturalHeight*fs;
    posX=(window.innerWidth-w)/2;
    posY=(window.innerHeight-h)/2;
  }
  function reset(){ scale=fitScale; centerAt(scale); apply(); }
  function zoomAt(screenX,screenY,newScale){
    newScale=clampScale(newScale);
    const ratio=newScale/scale;
    posX=screenX-(screenX-posX)*ratio;
    posY=screenY-(screenY-posY)*ratio;
    scale=newScale;
    apply();
  }

  window.openMapZoom=function(src){
    img.classList.remove('ready');
    zoomLoading.classList.remove('hide');
    img.src=src;
    const onReady=()=>{
      const nw=img.naturalWidth||1, nh=img.naturalHeight||1;
      fitScale=Math.min(1,(window.innerWidth*PAD)/nw,(window.innerHeight*PAD)/nh);
      scale=fitScale;
      centerAt(scale);
      apply();
      img.classList.add('ready');
      zoomLoading.classList.add('hide');
    };
    if(img.complete && img.naturalWidth) onReady();
    else img.onload=onReady;
    overlay.classList.add('show');
    hint.textContent=(i18n[lang]&&i18n[lang].zoomHint)||'';
    document.body.style.overflow='hidden';
  };
  function closeZoom(){
    overlay.classList.remove('show');
    document.body.style.overflow='';
    setTimeout(()=>{ if(!overlay.classList.contains('show')){img.src='';img.classList.remove('ready');} },250);
  }
  document.getElementById('zoomClose').addEventListener('click',closeZoom);
  overlay.addEventListener('click',e=>{ if(e.target===overlay||e.target===document.getElementById('zoomStage'))closeZoom(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&overlay.classList.contains('show'))closeZoom(); });
  window.addEventListener('resize',()=>{ if(overlay.classList.contains('show')&&img.naturalWidth){
    const nw=img.naturalWidth,nh=img.naturalHeight;
    fitScale=Math.min(1,(window.innerWidth*PAD)/nw,(window.innerHeight*PAD)/nh);
    if(scale<fitScale)scale=fitScale;
    centerAt(scale);apply();
  }});

  overlay.addEventListener('wheel',e=>{
    if(!overlay.classList.contains('show'))return;
    e.preventDefault();
    zoomAt(e.clientX,e.clientY,scale*(e.deltaY<0?1.2:1/1.2));
  },{passive:false});

  img.addEventListener('mousedown',e=>{
    e.preventDefault();dragging=true;img.classList.add('dragging');
    startX=e.clientX;startY=e.clientY;startPosX=posX;startPosY=posY;
  });
  window.addEventListener('mousemove',e=>{
    if(!dragging)return;
    posX=startPosX+(e.clientX-startX);posY=startPosY+(e.clientY-startY);
    apply();
  });
  window.addEventListener('mouseup',()=>{dragging=false;img.classList.remove('dragging');});

  img.addEventListener('dblclick',e=>{
    if(scale>fitScale*1.01)reset();
    else zoomAt(e.clientX,e.clientY,fitScale*3.2);
  });

  function touchDist(t){ const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
  overlay.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      pinchDist=touchDist(e.touches);pinchScale=scale;
    } else if(e.touches.length===1){
      dragging=true;
      startX=e.touches[0].clientX;startY=e.touches[0].clientY;startPosX=posX;startPosY=posY;
    }
  },{passive:true});
  overlay.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      e.preventDefault();
      const midX=(e.touches[0].clientX+e.touches[1].clientX)/2;
      const midY=(e.touches[0].clientY+e.touches[1].clientY)/2;
      zoomAt(midX,midY,pinchScale*(touchDist(e.touches)/pinchDist));
    } else if(e.touches.length===1&&dragging){
      e.preventDefault();
      posX=startPosX+(e.touches[0].clientX-startX);posY=startPosY+(e.touches[0].clientY-startY);
      apply();
    }
  },{passive:false});
  overlay.addEventListener('touchend',()=>{dragging=false;});
})();

render(true);
addEventListener('load',()=>setTimeout(()=>positionPill(true),60));
requestAnimationFrame(()=>positionPill(true));
