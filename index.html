ів)."},"p":{"ru":"Бан 5 дней (14 дней хардов, зависит от ситуации).","uk":"Бан 5 днів (14 днів хардів, залежить від ситуації)."},"e":{"ru":"","uk":""}},{"sub":"§1.6","type":"severe","t":{"ru":"Включение гимнов любых государств (как существующих, так и исторических / прекративших существование) в голосовой чат или через саундпады.","uk":"Увімкнення гімнів будь-яких держав (як існуючих, так і історичних / тих, що припинили існування) у голосовий чат або через саундпади."},"p":{"ru":"Бан 7 дней (14 дней хардов, зависит от того, какие гимны были включены).","uk":"Бан 7 днів (14 днів хардів, залежить від того, які гімни було ввімкнено)."},"e":{"ru":"","uk":""}},{"sub":"§1.7","type":"fine","t":{"ru":"Целенаправленная травля (буллинг) и преследование (сталкинг) конкретного игрока с целью испортить ему игровой процесс или вывести на эмоции.","uk":"Цілеспрямоване цькування (булінг) і переслідування (сталкінг) конкретного гравця з метою зіпсувати йому ігровий процес або вивести на емоції."},"p":{"ru":"Бан 1-3 дней","uk":"Бан 1-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§1.8","type":"fine","t":{"ru":"Массовый буллинг — коллективное унижение, травля или издевательства над одним игроком группой лиц.","uk":"Масовий булінг — колективне приниження, цькування чи знущання над одним гравцем групою осіб."},"p":{"ru":"Бан 3 дней каждому участнику","uk":"Бан 3 дні кожному учаснику"},"e":{"ru":"","uk":""}},{"sub":"§1.9","type":"severe","t":{"ru":"Докс — поиск, слив или угроза публикации личных данных игрока (фотографий, адреса, номера телефона, соцсетей) без его согласия.","uk":"Докс — пошук, злив або погроза публікації особистих даних гравця (фотографій, адреси, номера телефону, соцмереж) без його згоди."},"p":{"ru":"Перманетный бан(За фото). За остальное ЧСП","uk":"Перманентний бан (за фото). За решту — ЧСП"},"e":{"ru":"","uk":""}},{"sub":"§1.10","type":"fine","t":{"ru":"Дискриминация игроков по возрасту, голосу или особенностям речи (высмеивание акцента, дефектов дикции, писклявого/грубого ":"§1.16","type":"fine","t":{"ru":"Использование непристойных, провокационных или унижающих анимаций по отношению к другим игрокам (особенно к тем, кто находится в наручниках или ранен).","uk":"Використання непристойних, провокаційних або принизливих анімацій щодо інших гравців (особливо тих, хто в наручниках або поранений)."},"p":{"ru":"Предупреждение→Бан 1 день","uk":"Попередження→Бан 1 день"},"e":{"ru":"","uk":""}}]},{"num":2,"icon":"fa-car","tt":{"ru":"ПДД и правила использования транспорта","uk":"ПДР та правила користування транспортом"},"items":[{"sub":"§2.1","type":"fine","t":{"ru":"Намеренный таран других транспортных средств без веской причины.","uk":"Навмисний таран інших транспортних засобів без поважної причини."},"p":{"ru":"Предупреждение→Бан 1-2 дня","uk":"Попередження→Бан 1-2 дні"},"e":{"ru":"","uk":""}},{"sub":"§2.2","type":"fine","t":{"ru":"Езда с пробитыми колёсами (от 2–3 повреждённых колёс) на высокой скорости.","uk":"Їзда з пробитими колесами (від 2–3 пошкоджених коліс) на високій швидкості."},"p":{"ru":"Предупреждение→Бан 1 день","uk":"Попередження→Бан 1 день"},"e":{"ru":"","uk":""}},{"sub":"§2.3","type":"fine","t":{"ru":"Заезд в тюнинг для покраски, починки во время активной погони или перестрелки с целью мгновенно починить авто.","uk":"Заїзд у тюнінг для фарбування, ремонту під час активної погоні чи перестрілки з метою миттєво полагодити авто."},"p":{"ru":"Бан 1–2 дня","uk":"Бан 1–2 дні"},"e":{"ru":"","uk":""}},{"sub":"§2.4","type":"fine","t":{"ru":"Езда на скутерах при наличии розыска или во время ухода от полиции.","uk":"Їзда на скутерах за наявності розшуку або під час втечі від поліції."},"p":{"ru":"Бан 1 день","uk":"Бан 1 день"},"e":{"ru":"","uk":""}},{"sub":"§2.6","type":"fine","t":{"ru":"Намеренная езда по встречной полосе на трассах и мостах с целью создания лобовых столкновений и помех игрокам.","uk":"Навмисна їзда зустрічною смугою на трасах і мостах з метою створення лобових зіткнень і перешкод гравцям."},"p":{"ru":"Бан 1 день","uk":"Бан 1 день"},"e":{"ru":"","uk":""}},{"sub":"§2.8","type":"fine","t":{"ru":"Массовый таран толпы игроков или скопления машин на парковках, мероприятиях и тому подобного.","uk":"Масовий таран натовпу гравців або скупчення машин на парковках, заходах тощо."},"p":{"ru":"Бан 1-5 дней","uk":"Бан 1-5 днів"},"e":{"ru":"","uk":""}},{"sub":"§2.9","type":"fine","t":{"ru":"Использование сельскохозяйственного транспорта в городе.","uk":"Використання сільськогосподарського транспорту в місті."},"p":{"ru":"Предупреждение→Бан 1 день","uk":"Попередження→Бан 1 день"},"e":{"ru":"","uk":""}},{"sub":"§2.10","type":"fine","t":{"ru":"Намеренный уход от погони в воду (утопление себя или автомобиля, чтобы избежать задержания).","uk":"Навмисна втеча від погоні у воду (утоплення себе чи автомобіля, щоб уникнути затримання)."},"p":{"ru":"Бан 2–3 дня","uk":"Бан 2–3 дні"},"e":{"ru":"","uk":""}},{"sub":"§2.11","type":"fine","t":{"ru":"Продолжение движения на автомобиле после тяжёлого лобового столкновения.","uk":"Продовження руху на автомобілі після важкого лобового зіткнення."},"p":{"ru":"Бан 2-3 дня","uk":"Бан 2-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§2.12","type":"fine","t":{"ru":"Намеренное включение громкой музыки, саундпадов в автомобиле в людных местах с целью мешать другим игрокам.","uk":"Навмисне вмикання гучної музики, саундпадів в автомобілі в людних місцях з метою заважати іншим гравцям."},"p":{"ru":"Предупреждение→Бан 1-3 дня","uk":"Попередження→Бан 1-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§2.13","type":"fine","t":{"ru":"Намеренное подрезание по пингу (использование задержки интернета для того, чтобы выбить чужую машину).","uk":"Навмисне підрізання за пінгом (використання затримки інтернету, щоб вибити чужу машину)."},"p":{"ru":"Бан 1-3 дня","uk":"Бан 1-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§2.14","type":"fine","t":{"ru":"Беспричинный таран и скидывание в воду пустых припаркованных автомобилей.","uk":"Безпричинний таран і скидання у воду порожніх припаркованих автомобілів."},"p":{"ru":"Предупреждение+Кик→Бан 1 день","uk":"Попередження+Кік→Бан 1 день"},"e":{"ru":"","uk":""}},{"sub":"§2.15","type":"fine","t":{"ru":"Помеха работе дальнобойщиков и автобусников (намеренное блокирование маршрута, подрезание прицепов).","uk":"Перешкода роботі далекобійників і автобусників (навмисне блокування маршруту, підрізання причепів)."},"p":{"ru":"Предупреждение→Бан 1–2 дня","uk":"Попередження→Бан 1–2 дні"},"e":{"ru":"","uk":""}},{"sub":"§2.16","type":"fine","t":{"ru":"Игнорирование административных предупреждений о необходимости убрать мешающий транспорт с проезжей части или спавна.","uk":"Ігнорування адміністративних попереджень про необхідність прибрати транспорт, що заважає, з проїжджої частини чи спавну."},"p":{"ru":"Кик→Бан 1 день","uk":"Кік→Бан 1 день"},"e":{"ru":"","uk":""}}]},{"num":3,"icon":"fa-tree","tt":{"ru":"Зелёные зоны (Green Zone)","uk":"Зелені зони (Green Zone)"},"items":[{"sub":"§3.1","type":"fine","t":{"ru":"Нахождение с оружием в руках в зелёной зоне. ИСКЛЮЧЕНИЕ: для гос. фракций.","uk":"Перебування зі зброєю в руках у зеленій зоні. ВИНЯТОК: для держ. фракцій."},"p":{"ru":"Бан 1 день","uk":"Бан 1 день"},"e":{"ru":"","uk":""}},{"sub":"§3.2","type":"fine","t":{"ru":"Провокация на конфликт, убийство или нанесение любого урона игрокам в зелёной зоне.","uk":"Провокація на конфлікт, вбивство або завдання будь-якої шкоди гравцям у зеленій зоні."},"p":{"ru":"Бан 3-5 дня","uk":"Бан 3-5 днів"},"e":{"ru":"","uk":""}},{"sub":"§3.3","type":"severe","t":{"ru":"Использование холодного/огнестрельного оружия в зелёной зоне.","uk":"Використання холодної/вогнепальної зброї в зеленій зоні."},"p":{"ru":"Бан 1-7дней","uk":"Бан 1-7 днів"},"e":{"ru":"","uk":""}},{"sub":"§3.4","type":"fine","t":{"ru":"Находиться в маске/скрывать лицо в зеленой зоне.","uk":"Перебування в масці/приховування обличчя в зеленій зоні."},"p":{"ru":"Бан 1 день","uk":"Бан 1 день"},"e":{"ru":"","uk":""}},{"sub":"§3.5","type":"severe","t":{"ru":"Использование пиротехники в зелёных зонах.","uk":"Використання піротехніки в зелених зонах."},"p":{"ru":"Перманентный бан","uk":"Перманентний бан"},"e":{"ru":"","uk":""}},{"sub":"§3.6","type":"fine","t":{"ru":"Прицеливание из огнестрельного оружия в сторону игроков или транспорта в зелёной зоны.","uk":"Націлювання з вогнепальної зброї в бік гравців або транспорту в зеленій зоні."},"p":{"ru":"Бан 12 часов-1 день","uk":"Бан 12 годин-1 день"},"e":{"ru":"","uk":""}},{"sub":"§3.7","type":"fine","t":{"ru":"Бросание светошумовых гранат в зелёной зоне","uk":"Кидання світлошумових гранат у зеленій зоні."},"p":{"ru":"Бан 6 часов-2 дня","uk":"Бан 6 годин-2 дні"},"e":{"ru":"","uk":""}},{"sub":"§3.8","type":"fine","t":{"ru":"Массовые драки и беспорядки на территории зелёной зоны (участие 3 и более человек).","uk":"Масові бійки та безлади на території зеленої зони (участь 3 і більше осіб)."},"p":{"ru":"Бан 2–3 дня каждому участник","uk":"Бан 2–3 дні кожному учаснику"},"e":{"ru":"","uk":""}}]},{"num":4,"icon":"fa-book","tt":{"ru":"RP-термины и наказания","uk":"RP-терміни та покарання"},"items":[{"sub":"§4.1","type":"fine","t":{"ru":"DM (DeathMatch) — нанесение урона или убийство без IC-причины (от 2 ударов).","uk":"DM (DeathMatch) — завдання шкоди або вбивство без IC-причини (від 2 ударів)."},"p":{"ru":"Бан 1–3 дня","uk":"Бан 1–3 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.2","type":"fine","t":{"ru":"DB (DriveBy) — намеренный наезд или таран.","uk":"DB (DriveBy) — навмисний наїзд або таран."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.3","type":"severe","t":{"ru":"RDM (Random DeathMatch) — массовый DM.","uk":"RDM (Random DeathMatch) — масовий DM."},"p":{"ru":"Бан 5–10 дней (10-20 дней хардов, зависит от ситуации).","uk":"Бан 5–10 днів (10-20 днів хардів, залежить від ситуації)."},"e":{"ru":"","uk":""}},{"sub":"§4.4","type":"fine","t":{"ru":"RK (Revenge Kill) — возвращение на место своей смерти с целью отомстить игроку.","uk":"RK (Revenge Kill) — повернення на місце своєї смерті з метою помститися гравцю."},"p":{"ru":"Бан 1-3 дня","uk":"Бан 1-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.5","type":"fine","t":{"ru":"PG (PowerGaming) — преувеличение физических возможностей своего персонажа.","uk":"PG (PowerGaming) — перебільшення фізичних можливостей свого персонажа."},"p":{"ru":"Бан 1-3 дня","uk":"Бан 1-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.6","type":"fine","t":{"ru":"Fear RP — отсутствие страха за свою жизнь при прямой угрозе.","uk":"Fear RP — відсутність страху за своє життя при прямій загрозі."},"p":{"ru":"Бан 1-3 дня","uk":"Бан 1-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.7","type":"fine","t":{"ru":"Fail RP — нереалистичное поведение персонажа, противоречащее логике, здравому смыслу или нормам реальной жизни.","uk":"Fail RP — нереалістична поведінка персонажа, що суперечить логіці, здоровому глузду або нормам реального життя."},"p":{"ru":"Бан 1–5 дней","uk":"Бан 1–5 днів"},"e":{"ru":"","uk":""}},{"sub":"§4.8","type":"severe","t":{"ru":"Combat Logging — выход из игры во время активной RP-ситуации, погони, задержания или перестрелки.","uk":"Combat Logging — вихід із гри під час активної RP-ситуації, погоні, затримання чи перестрілки."},"p":{"ru":"Бан 10 дней","uk":"Бан 10 днів"},"e":{"ru":"","uk":""}},{"sub":"§4.9","type":"fine","t":{"ru":"MG (MetaGaming) — использование OOC информации в IC.","uk":"MG (MetaGaming) — використання OOC-інформації в IC."},"p":{"ru":"Бан 1-2 дня","uk":"Бан 1-2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.10","type":"fine","t":{"ru":"Уход от RP — намеренное игнорирование RP-отыгровок других игроков, отказ от взаимодействия в RP-ситуации или уход в AFK без выхода из игры.","uk":"Втеча від RP — навмисне ігнорування RP-відіграшів інших гравців, відмова від взаємодії в RP-ситуації або перехід в AFK без виходу з гри."},"p":{"ru":"Бан 2–3 дня","uk":"Бан 2–3 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.11","type":"fine","t":{"ru":"CopBaiting — намеренная провокация сотрудников полиции и гос. структур (таран патрульных авто, оскорбления в упор) с целью вызвать погоню или перестрелку без RP-мотива.","uk":"CopBaiting — навмисна провокація співробітників поліції та держ. структур (таран патрульних авто, образи впритул) з метою викликати погоню чи перестрілку без RP-мотиву."},"p":{"ru":"Бан 2-3 дня (4-6 дней хардов, зависит от количества).","uk":"Бан 2-3 дні (4-6 днів хардів, залежить від кількості)."},"e":{"ru":"","uk":""}},{"sub":"§4.12","type":"fine","t":{"ru":"Убийство AFK-персонажа — нанесение урона, убийство, который отошёл от компьютера и не участвует в игровом процессе.","uk":"Вбивство AFK-персонажа — завдання шкоди або вбивство гравця, який відійшов від комп'ютера й не бере участі в ігровому процесі."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.13","type":"fine","t":{"ru":"NRP Inventory — хранение и использование предметов в инвентаре в обход логики реальной жизни (например, ношение нескольких автоматов или крупногабаритных вещей в карманах; исключение: печеньки, какао, яблоки, энергетики).","uk":"NRP Inventory — зберігання та використання предметів в інвентарі в обхід логіки реального життя (наприклад, носіння кількох автоматів або великогабаритних речей у кишенях; виняток: печиво, какао, яблука, енергетики)."},"p":{"ru":"Бан 1–3 дня","uk":"Бан 1–3 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.14","type":"fine","t":{"ru":"DelayRP — намеренное затягивание RP-процесса без веской IC-причины (лимит на суд / досудебное — до 1 часа, на остальные RP-ситуации — до 20 минут).","uk":"DelayRP — навмисне затягування RP-процесу без поважної IC-причини (ліміт на суд / досудове — до 1 години, на решту RP-ситуацій — до 20 хвилин)."},"p":{"ru":"Бан 1–2 дня","uk":"Бан 1–2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.15","type":"fine","t":{"ru":"NonRP Behavior — обесценивание ценного имущества (например, намеренный таран столбов и знаков на дорогом автомобиле ради развлечения).","uk":"NonRP Behavior — знецінення цінного майна (наприклад, навмисний таран стовпів і знаків на дорогому автомобілі заради розваги)."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.16","type":"severe","t":{"ru":"ERP (Erotic RolePlay) — отыгровка действий сексуального, интимного или эротического характера в любом виде.","uk":"ERP (Erotic RolePlay) — відіграш дій сексуального, інтимного чи еротичного характеру в будь-якому вигляді."},"p":{"ru":"Бан 7 дней","uk":"Бан 7 днів"},"e":{"ru":"","uk":""}},{"sub":"§4.17","type":"fine","t":{"ru":"NonRP Heal — использование печенек, яблок для восстановления здоровья без RP-отыгровки или непосредственно во время активной перестрелки/драки.","uk":"NonRP Heal — використання печива, яблук для відновлення здоров'я без RP-відіграшу або безпосередньо під час активної перестрілки/бійки."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.18","type":"fine","t":{"ru":"NonRP Cop - действия сотрудника полиции, нарушающие логику RP или правила гос. структур.","uk":"NonRP Cop — дії співробітника поліції, що порушують логіку RP або правила держ. структур."},"p":{"ru":"Бан 3 дня","uk":"Бан 3 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.19","type":"fine","t":{"ru":"NonRP Drive — нереалистичное управление транспортным средством (езда на спорткарах по горам и бездорожью, езда на высокой скорости с пробитыми колёсами).","uk":"NonRP Drive — нереалістичне керування транспортним засобом (їзда на спорткарах по горах і бездоріжжю, їзда на високій швидкості з пробитими колесами)."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.20","type":"fine","t":{"ru":"Combat Medic — оказание медицинской помощи игроку во время активной перестрелки.","uk":"Combat Medic — надання медичної допомоги гравцю під час активної перестрілки."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.21","type":"fine","t":{"ru":"BH (BunnyHop) — прыжки во время движения для уклонения от пуль или выстрелов тайзера.","uk":"BH (BunnyHop) — стрибки під час руху для ухилення від куль або пострілів тайзера."},"p":{"ru":"Бан 3 дня","uk":"Бан 3 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.23","type":"fine","t":{"ru":"TK (Team Kill) — намеренное нанесение урона или убийство участников своей фракции, банды или команды","uk":"TK (Team Kill) — навмисне завдання шкоди або вбивство учасників своєї фракції, банди чи команди."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.24","type":"fine","t":{"ru":"SK (Spawn Kill) — убийство или нанесение урона игроку на месте его появления.","uk":"SK (Spawn Kill) — вбивство або завдання шкоди гравцю на місці його появи."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.25","type":"severe","t":{"ru":"Bypass Ban — обход блокировки аккаунта любыми способами.","uk":"Bypass Ban — обхід блокування акаунта будь-якими способами."},"p":{"ru":"Перманентный бан","uk":"Перманентний бан"},"e":{"ru":"","uk":""}},{"sub":"§4.26","type":"fine","t":{"ru":"Bodyblock — намеренное блокирование движения игрока или транспорта своим персонажем","uk":"Bodyblock — навмисне блокування руху гравця чи транспорту своїм персонажем."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.27","type":"fine","t":{"ru":"NonRP Cuff — надевание наручников на бегу/во время активного передвижения, засчитывается как PowerGaming.","uk":"NonRP Cuff — надягання наручників на бігу/під час активного пересування, зараховується як PowerGaming."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.28","type":"fine","t":{"ru":"NLR(New Life Rule) - возвращение на точку смерти игрока(Таймер на это правило 20-30 минут), а после лечения медиком игрок находиться в шоковом состоянии 5-7 минут.","uk":"NLR (New Life Rule) — повернення на точку смерті гравця (таймер на це правило 20–30 хвилин), а після лікування медиком гравець перебуває в шоковому стані 5–7 хвилин."},"p":{"ru":"Бан 2-3 дня","uk":"Бан 2-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§4.29","type":"fine","t":{"ru":"Repeat Kill - намеренное повторное убийство одного и того же игрока.","uk":"Repeat Kill — навмисне повторне вбивство того самого гравця."},"p":{"ru":"Бан 2-3 дня","uk":"Бан 2-3 дні"},"e":{"ru":"","uk":""}}]},{"num":5,"icon":"fa-shirt","tt":{"ru":"Внешний вид / Аватары","uk":"Зовнішній вигляд / Аватари"},"items":[{"sub":"§5.1","type":"fine","t":{"ru":"Оскорбительные скины, форма спецслужб для тех, кто не состоит во фракции, а также крупногабаритные скины.","uk":"Образливі скіни, форма спецслужб для тих, хто не перебуває у фракції, а також великогабаритні скіни."},"p":{"ru":"Предупреждение+Кик→Бан 2 дня","uk":"Попередження+Кік→Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§5.2","type":"fine","t":{"ru":"Скины животных или несуществующих существ без качественной RP-отыгровки.","uk":"Скіни тварин або неіснуючих істот без якісного RP-відіграшу."},"p":{"ru":"Предупреждение+Кик→Бан 5 дней","uk":"Попередження+Кік→Бан 5 днів"},"e":{"ru":"","uk":""}},{"sub":"§5.3","type":"severe","t":{"ru":"Скины, футболки и аксессуары с запрещённой политической символикой, флагами и знаками.","uk":"Скіни, футболки та аксесуари із забороненою політичною символікою, прапорами та знаками."},"p":{"ru":"Предупреждение+Кик→Перманентный бан","uk":"Попередження+Кік→Перманентний бан"},"e":{"ru":"","uk":""}},{"sub":"§5.4","type":"severe","t":{"ru":"Спец. службы и их формы — запрещено носить формы с какими-либо сторонними флагами, символами, повязками или гербами (исключение: украинский флаг, символы, знаки и тому подобное).","uk":"Спецслужби та їхні форми — заборонено носити форми з будь-якими сторонніми прапорами, символами, пов'язками чи гербами (виняток: український прапор, символи, знаки тощо)."},"p":{"ru":"Предупреждение+Кик→Перманентный бан","uk":"Попередження+Кік→Перманентний бан"},"e":{"ru":"","uk":""}},{"sub":"§5.5","type":"fine","t":{"ru":"Использование мини-аватаров, карликовых бандлов и багованных ног/торсов.","uk":"Використання міні-аватарів, карликових бандлів і баґованих ніг/торсів."},"p":{"ru":"Предупреждение+Кик→Бан 2 дня","uk":"Попередження+Кік→Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§5.6","type":"severe","t":{"ru":"Ношение на аватаре элементов одежды или аксессуаров с контентом 18+, кровью или расчленёнкой.","uk":"Носіння на аватарі елементів одягу чи аксесуарів із контентом 18+, кров'ю або розчленуванням."},"p":{"ru":"Предупреждение+Кик→Бан 7 дней (14 дней хардов, зависит от изображений).","uk":"Попередження+Кік→Бан 7 днів (14 днів хардів, залежить від зображень)."},"e":{"ru":"","uk":""}},{"sub":"§5.7","type":"fine","t":{"ru":"Систематическое игнорирование требований администрации сменить несоответствующий правилам аватар после предупреждения или кика.","uk":"Систематичне ігнорування вимог адміністрації змінити аватар, що не відповідає правилам, після попередження чи кіка."},"p":{"ru":"Бан 1-3 дней","uk":"Бан 1-3 дні"},"e":{"ru":"","uk":""}}]},{"num":6,"icon":"fa-user-shield","tt":{"ru":"Отношение к Администрации","uk":"Ставлення до Адміністрації"},"items":[{"sub":"§6.1","type":"fine","t":{"ru":"Оскорбление администрации — хамство и оскорбления админа в OOC / Войсе / Discord / Telegram / В любых чатах.","uk":"Образа адміністрації — хамство та образи адміна в OOC / Войсі / Discord / Telegram / у будь-яких чатах."},"p":{"ru":"3 дня","uk":"3 дні"},"e":{"ru":"","uk":""}},{"sub":"§6.2","type":"severe","t":{"ru":"Неуважение и оскорбление родных администрации — любые прямые или завуалированные упоминания, оскорбления и провокации в сторону родственников или близких администратора в любых чатах, войсе и соцсетях проекта.","uk":"Неповага та образа рідних адміністрації — будь-які прямі чи завуальовані згадки, образи й провокації в бік родичів або близьких адміністратора в будь-яких чатах, войсі та соцмережах проєкту."},"p":{"ru":"10 дней (20 дней хардов, зависит от жестокости оскорблений).","uk":"10 днів (20 днів хардів, залежить від жорстокості образ)."},"e":{"ru":"","uk":""}},{"sub":"§6.3","type":"fine","t":{"ru":"Неуважение и помеха работе — перебивание, хамство, провокации и всему подобное.","uk":"Неповага та перешкода роботі — перебивання, хамство, провокації тощо."},"p":{"ru":"от 1 до 3 дней","uk":"від 1 до 3 днів"},"e":{"ru":"","uk":""}},{"sub":"§6.4","type":"fine","t":{"ru":"Неподчинение требованиям администрации — игнорирование или прямой отказ выполнять законные OOC-указания администратора (Например, прекратить NonRP действия, предоставить откат, сменить NonRP скин).","uk":"Непідкорення вимогам адміністрації — ігнорування або пряма відмова виконувати законні OOC-вказівки адміністратора (наприклад, припинити NonRP дії, надати відкат, змінити NonRP скін)."},"p":{"ru":"от 2 до 4 дней","uk":"від 2 до 4 днів"},"e":{"ru":"","uk":""}},{"sub":"§6.5","type":"severe","t":{"ru":"Угрозы в адрес администрации — угрозы расправой в реале, доксом, деаноном, вредом серверу и всему подобному.","uk":"Погрози на адресу адміністрації — погрози розправою в реалі, доксом, деаноном, шкодою серверу тощо."},"p":{"ru":"Бан от 14 дней до ЧСП","uk":"Бан від 14 днів до ЧСП"},"e":{"ru":"","uk":""}},{"sub":"§6.6","type":"severe","t":{"ru":"Обман администрации — ложь, скрытие фактов или подделка доказательств (скринов / откатов).","uk":"Обман адміністрації — брехня, приховування фактів або підробка доказів (скринів / відкатів)."},"p":{"ru":"Бан 7 дней","uk":"Бан 7 днів"},"e":{"ru":"","uk":""}},{"sub":"§6.7","type":"severe","t":{"ru":"Вмешательство в разборки третьих лиц/помеха проведению админ-разборок (стрельба, влезание в диалог и всему подобное).","uk":"Втручання в розбірки третіх осіб / перешкода проведенню адмін-розборок (стрільба, влізання в діалог тощо)."},"p":{"ru":"Бан от 3 до 7 дней","uk":"Бан від 3 до 7 днів"},"e":{"ru":"","uk":""}},{"sub":"§6.8","type":"severe","t":{"ru":"Выход с игры во время разбирательства с администрацией (Админ обязан подождать 10 минут, только если человек за это время не зашел обратно банить, либо же отписать админу причину выхода).","uk":"Вихід із гри під час розбору з адміністрацією (адмін зобов'язаний почекати 10 хвилин, і лише якщо гравець за цей час не зайшов назад — банити, або ж написати адміну причину виходу)."},"p":{"ru":"Бан 7 дней","uk":"Бан 7 днів"},"e":{"ru":"","uk":""}},{"sub":"§6.9","type":"fine","t":{"ru":"Игнорирование требования администрации освободить зону проведения разборок (для посторонних игроков, стоящих рядом и подслушивающих).","uk":"Ігнорування вимоги адміністрації звільнити зону проведення розборок (для сторонніх гравців, що стоять поруч і підслуховують)."},"p":{"ru":"Кик→Бан от 12 часов до 2 дня","uk":"Кік→Бан від 12 годин до 2 днів"},"e":{"ru":"","uk":""}},{"sub":"§6.10","type":"severe","t":{"ru":"Создание твинков с оскорбительными никнеймами в адрес конкретных администраторов проекта.","uk":"Створення твінків з образливими нікнеймами на адресу конкретних адміністраторів проєкту."},"p":{"ru":"Перманентный бан","uk":"Перманентний бан"},"e":{"ru":"","uk":""}},{"sub":"§6.11","type":"fine","t":{"ru":"Дискриминация, высмеивание голоса, возраста, акцента или особенностей администратора.","uk":"Дискримінація, висміювання голосу, віку, акценту чи особливостей адміністратора."},"p":{"ru":"Бан 3–5 дней","uk":"Бан 3–5 днів"},"e":{"ru":"","uk":""}},{"sub":"§6.12","type":"fine","t":{"ru":"Самовольный уход с места проведения разборок (убегание, уезд на транспорте и тому подобное).","uk":"Самовільний відхід із місця проведення розборок (втеча, від'їзд на транспорті тощо)."},"p":{"ru":"Бан 3–5 дней","uk":"Бан 3–5 днів"},"e":{"ru":"","uk":""}},{"sub":"§6.13","type":"severe","t":{"ru":"Попытка шантажа администратора (угрозы сливом переписок, жалобой руководству или публикацией старых материалов ради выгоды).","uk":"Спроба шантажу адміністратора (погрози зливом листувань, скаргою керівництву або публікацією старих матеріалів заради вигоди)."},"p":{"ru":"Бан от 14 дней до ЧСП","uk":"Бан від 14 днів до ЧСП"},"e":{"ru":"","uk":""}},{"sub":"§6.14","type":"fine","t":{"ru":"Преследование (сталкинг) администратора по карте во время его работы (наблюдения за игроками, разбора репортов), мешающее оставаться незаметным.","uk":"Переслідування (сталкінг) адміністратора по карті під час його роботи (спостереження за гравцями, розбір репортів), що заважає залишатися непомітним."},"p":{"ru":"Предупреждение→Бан 1-3 дня","uk":"Попередження→Бан 1-3 дні"},"e":{"ru":"","uk":""}}]},{"num":7,"icon":"fa-microphone","tt":{"ru":"Голосовой чат и рация","uk":"Голосовий чат і рація"},"items":[{"sub":"§7.1","type":"fine","t":{"ru":"Использование ПО для изменения голоса.","uk":"Використання ПЗ для зміни голосу."},"p":{"ru":"бан 5 дней","uk":"бан 5 днів"},"e":{"ru":"","uk":""}},{"sub":"§7.2","type":"fine","t":{"ru":"Посторонние громкие звуки, музыка без согласия.","uk":"Сторонні гучні звуки, музика без згоди."},"p":{"ru":"бан 3 дня","uk":"бан 3 дні"},"e":{"ru":"","uk":""}},{"sub":"§7.3","type":"fine","t":{"ru":"Перебивание, создание шума и помех в голосовом чате.","uk":"Перебивання, створення шуму та перешкод у голосовому чаті."},"p":{"ru":"бан 2 дня","uk":"бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§7.4","type":"fine","t":{"ru":"Использование Soundpad, программных звуковых эффектов, скримеров и резких звуков в войс-чате или рации.","uk":"Використання Soundpad, програмних звукових ефектів, скримерів і різких звуків у войс-чаті чи рації."},"p":{"ru":"Бан 2–3 дня","uk":"Бан 2–3 дні"},"e":{"ru":"","uk":""}},{"sub":"§7.5","type":"fine","t":{"ru":"Использование служебной рации в бессознательном состоянии персонажа, а также находясь в наручниках или в плену.","uk":"Використання службової рації в непритомному стані персонажа, а також перебуваючи в наручниках або в полоні."},"p":{"ru":"Бан 1–2 дня","uk":"Бан 1–2 дні"},"e":{"ru":"","uk":""}},{"sub":"§7.6","type":"severe","t":{"ru":"Включение нацистских речей, запрещённых лозунгов или аудиоматериалов экстремистского характера в голосовой чат или рацию.","uk":"Увімкнення нацистських промов, заборонених гасел або аудіоматеріалів екстремістського характеру в голосовий чат чи рацію."},"p":{"ru":"Перманентный бан и возможный ЧСП","uk":"Перманентний бан :""}},{"sub":"§7.12","type":"fine","t":{"ru":"Использование служебной рации не по назначению — флуд, беседы на личные темы, шутки и в общем оффтоп в служебной рации.","uk":"Використання службової рації не за призначенням — флуд, розмови на особисті теми, жарти й загалом офтоп у службовій рації."},"p":{"ru":"Предупреждение+Кик→Бан от 12 часов до 2 дней","uk":"Попередження+Кік→Бан від 12 годин до 2 днів"},"e":{"ru":"","uk":""}},{"sub":"§7.13","type":"severe","t":{"ru":"Оскорбления, унижения и травля игроков в голосовом чате или рации на почве национальности, расы, религии или языка общения.","uk":"Образи, приниження та цькування гравців у голосовому чаті чи рації на ґрунті національності, раси, релігії або мови спілкування."},"p":{"ru":"Бан 7–14 дней (14-20 дней хардов, зависит от жестокости происходящего).","uk":"Бан 7–14 днів (14-20 днів хардів, залежить від жорстокості того, що відбувається)."},"e":{"ru":"","uk":""}},{"sub":"§7.14","type":"severe","t":{"ru":"Включение аудиозаписей с контентом 18+, стонами, порнографическим или шокирующим звуковым сопровождением в голосовой чат.","uk":"Увімкнення аудіозаписів із контентом 18+, стогонами, порнографічним або шокуючим звуковим супроводом у голосовий чат."},"p":{"ru":"Бан 7–14 дней (14-20 дней хардов, зависит от контента).","uk":"Бан 7–14 днів (14-20 днів хардів, залежить від контенту)."},"e":{"ru":"","uk":""}}]},{"num":8,"icon":"fa-people-group","tt":{"ru":"Тиминг","uk":"Тімінг"},"items":[{"sub":"§8.1","type":"fine","t":{"ru":"Гражданскому запрещено садиться на охраняемое / служебное место.","uk":"Цивільному заборонено сідати на охоронюване / службове місце."},"p":{"ru":"Бан 1-3 дня","uk":"Бан 1-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§8.2","type":"fine","t":{"ru":"Сотрудникам полиции запрещается иметь какие-либо контакты, договорённости или сотрудничество с криминальными фракциями и обычными криминальными лицами. ИСКЛЮЧЕНИЕ: НЕТ.","uk":"Співробітникам поліції забороняється мати будь-які контакти, домовленості чи співпрацю з кримінальними фракціями та звичайними кримінальними особами. ВИНЯТОК: НЕМАЄ."},"p":{"ru":"Бан 1-3 дня","uk":"Бан 1-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§8.3","type":"fine","t":{"ru":"Гражданским лицам запрещается оказывать содействие сотрудникам правоохранительных органов.","uk":"Цивільним особам забороняється надавати сприяння співробітникам правоохоронних органів."},"p":{"ru":"Бан 1-5 дней","uk":"Бан 1-5 днів"},"e":{"ru":"","uk":""}},{"sub":"§8.4","type":"fine","t":{"ru":"Запрещено совместно с криминальными лицами участвовать в перестрелках, погонях и других RP-ситуациях против третьих лиц.","uk":"Заборонено разом із кримінальними особами брати участь у перестрілках, погонях та інших RP-ситуаціях проти третіх осіб."},"p":{"ru":"Бан 2-4 дня","uk":"Бан 2-4 дні"},"e":{"ru":"","uk":""}},{"sub":"§8.5","type":"fine","t":{"ru":"Запрещается во время погони садиться в транспортное средство к человеку, который не находится в розыске.","uk":"Забороняється під час погоні сідати в транспортний засіб до людини, яка не перебуває в розшуку."},"p":{"ru":"Бан 1-3 дня","uk":"Бан 1-3 дні"},"e":{"ru":"","uk":""}},{"sub":"§8.6","type":"fine","t":{"ru":"Присутствие и пассивное наблюдение за нарушением игрока без попытки пресечь нарушение, находясь в одной тиме с нарушителем (соучастие).","uk":"Присутність і пасивне спостереження за порушенням гравця без спроби припинити порушення, перебуваючи в одному тімі з порушником (співучасть)."},"p":{"ru":"Бан 1–2 дня","uk":"Бан 1–2 дні"},"e":{"ru":"","uk":""}},{"sub":"§8.7","type":"fine","t":{"ru":"Намеренное игнорирование нарушений со стороны своего напарника по тимингу (например, полицейский видит, как его друг-гражданский убивает человека или грабит, но никак не реагирует).","uk":"Навмисне ігнорування порушень з боку свого напарника по тімінгу (наприклад, поліцейський бачить, як його друг-цивільний убиває людину або грабує, але ніяк не реагує)."},"p":{"ru":"Бан 2–3 дня","uk":"Бан 2–3 дні"},"e":{"ru":"","uk":""}},{"sub":"§8.8","type":"fine","t":{"ru":"Запрещено брать в заложники или похищать сотрудников собственной фракции/команды ради выкупа или шутки.","uk":"Заборонено брати в заручники або викрадати співробітників власної фракції/команди заради викупу чи жарту."},"p":{"ru":"Бан 2–3 дня","uk":"Бан 2–3 дні"},"e":{"ru":"","uk":""}}]},{"num":9,"icon":"fa-user-lock","tt":{"ru":"Правила похищений","uk":"Правила викрадень"},"items":[{"sub":"§9.1","type":"fine","t":{"ru":"Похищение осуществляется строго от двух человек и более (Похищением считается когда человека посадили в автомобиль не по его воле).","uk":"Викрадення здійснюється строго від двох осіб і більше (викраденням вважається, коли людину посадили в автомобіль не з її волі)."},"p":{"ru":"Бан 1 день","uk":"Бан 1 день"},"e":{"ru":"","uk":""}},{"sub":"§9.2","type":"fine","t":{"ru":"Отсутствие вызова переговорщика на место похищения (или отказ от ведения переговоров с гос. структурами).","uk":"Відсутність виклику переговорника на місце викрадення (або відмова від ведення переговорів з держ. структурами)."},"p":{"ru":"Бан 1–2 дня","uk":"Бан 1–2 дні"},"e":{"ru":"","uk":""}},{"sub":"§9.3","type":"fine","t":{"ru":"Запрещено требовать что-либо у самого похищенного человека (все требования выставляются исключительно переговорщику/гос. структурам).","uk":"Заборонено вимагати що-небудь у самої викраденої людини (усі вимоги виставляються виключно переговорнику/держ. структурам)."},"p":{"ru":"Бан 1 день","uk":"Бан 1 день"},"e":{"ru":"","uk":""}},{"sub":"§9.4","type":"fine","t":{"ru":"Запрещено похищать самого прибывшего переговорщика.","uk":"Заборонено викрадати самого переговорника, що прибув."},"p":{"ru":"Бан 2–3 дня","uk":"Бан 2–3 дні"},"e":{"ru":"","uk":""}},{"sub":"§9.5","type":"fine","t":{"ru":"Запрещено совершать похищения на территории Зелёных Зон и возле.","uk":"Заборонено здійснювати викрадення на території Зелених Зон і поруч."},"p":{"ru":"Бан 1–3 дня","uk":"Бан 1–3 дні"},"e":{"ru":"","uk":""}},{"sub":"§9.6","type":"fine","t":{"ru":"Похищение игроков, находящихся в AFK.","uk":"Викрадення гравців, які перебувають в AFK."},"p":{"ru":"Бан 2 дня","uk":"Бан 2 дні"},"e":{"ru":"","uk":""}},{"sub":"§9.7","type":"fine","t":{"ru":"Отказ похитителей отпускать заложника после того, как все требования были полностью выполнены.","uk":"Відмова викрадачів відпускати заручника після того, як усі вимоги було повністю виконано."},"p":{"ru":"Бан 3–5 дней","uk":"Бан 3–5 днів"},"e":{"ru":"","uk":""}},{"sub":"§9.8","type":"fine","t":{"ru":"Намеренный срыв похищения посторонними игроками (третьими лицами), которые не относятся к RP сцене.","uk":"Навмисний зрив викрадення сторонніми гравцями (третіми особами), які не належать до RP-сцени."},"p":{"ru":"Бан 1–2 дня","uk":"Бан 1–2 дні"},"e":{"ru":"","uk":""}},{"sub":"§9.9","type":"fine","t":{"ru":"Убийство заложника сразу после выполнения всех требований переговорщика.","uk":"Вбивство заручника одразу після виконання всіх вимог переговорника."},"p":{"ru":"Бан 3–5 дней","uk":"Бан 3–5 днів"},"e":{"ru":"","uk":""}},{"sub":"§9.10","type":"fine","t":{"ru":"Похищение только что появившихся, с целью фарма денег, развлечения и не только.","uk":"Викрадення щойно з'явившихся гравців з метою фарму грошей, розваги та не тільки."},"p":{"ru":"Бан 2–3 дня","uk":"Бан 2–3 дні"},"e":{"ru":"","uk":""}},{"sub":"§9.11","type":"fine","t":{"ru":"Похищение сотрудников ДСНС, HARS, дальнобойщиков или автобусников во время исполнения ими служебных обязанностей или просто работы.","uk":"Викрадення співробітників ДСНС, HARS, далекобійників чи автобусників під час виконання ними службових обов'язків або просто роботи."},"p":{"ru":"Бан 2–3 дня","uk":"Бан 2–3 дні"},"e":{"ru":"","uk":""}},{"sub":"§9.12","type":"fine","t":{"ru":"Похищение должно быть аргументированным.","uk":"Викрадення має бути аргументованим."},"p":{"ru":"Бан от 12 часов до 3 дней (Зависит от ситуации)","uk":"Бан від 12 годин до 3 днів (Залежить від ситуації)"},"e":{"ru":"","uk":""}}]},{"num":10,"icon":"fa-key","tt":{"ru":"Отмычки","uk":"Відмички"}, let lang='ru',activeFilter='all',curRule=null;

function setSwitchFlag(){
  const s=document.getElementById('langSwitch');
  s.classList.remove('flag-ru','flag-uk');
  s.classList.add(lang==='uk'?'flag-uk':'flag-ru');
}
function positionPill(instant){
  const pill=document.getElementById('pill');
  const a=document.querySelector('.chip.active');
  if(!a)return;
  if(instant)pill.style.transition='none';
  pill.style.width=a.offsetWidth+'px';
  pill.style.transform='translateX('+a.offsetLeft+'px)';
  if(instant)requestAnimationFrame(()=>{pill.style.transition='';});
}
function applyLang(){
  const t=i18n[lang];
  document.documentElement.lang=lang;
  document.getElementById('search').placeholder=t.search;
  document.getElementById('curLang').textContent=t.code;
  document.getElementById('langSwitch').title=t.switch;
  const c=document.querySelectorAll('.chip');
  c[0].textContent=t.all;c[1].textContent=t.fine;c[2].textContent=t.severe;
  setSwitchFlag();render();
  if(curRule)openModal(curRule,true);
  requestAnimationFrame(()=>positionPill(true));
}
function pickLang(l){
  lang=l;applyLang();
  const g=document.getElementById('gate');
  g.classList.add('hide');
  setTimeout(()=>{g.style.display='none';g.classList.remove('anim');},360);
}
function reopenGate(){
  const g=document.getElementById('gate');
  g.style.display='flex';
  g.classList.remove('hide');
  void g.offsetWidth;
  g.classList.add('anim');
}
let _searchTimer=null;
document.getElementById('search').addEventListener('input',()=>{clearTimeout(_searchTimer);_searchTimer=setTimeout(render,120);});
const itemText=x=>(x.sub+' '+x.t[lang]+' '+x.p[lang]).toLowerCase();

function paintSnow(cv){
  const card=cv.parentElement,dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(40,Math.round(card.offsetWidth+6)),h=44;
  cv.width=w*dpr;cv.height=h*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);
  const L=10,R=w-10,top=16;
  x.beginPath();x.moveTo(L,top);
  let cx=L;
  while(cx<R){const seg=Math.min(R-cx,26+Math.random()*34),hh=top-(5+Math.random()*10);x.quadraticCurveTo(cx+seg/2,hh-4,cx+seg,top-1-Math.random()*3);cx+=seg;}
  x.lineTo(R+4,top+4);
  cx=R;
  while(cx>L){const seg=Math.min(cx-L,16+Math.random()*26),dd=top+2+Math.random()*7;x.quadraticCurveTo(cx-seg/2,dd+6,cx-seg,top+2+Math.random()*3);cx-=seg;}
  x.closePath();
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#ffffff');g.addColorStop(.55,'#eef2fc');g.addColorStop(1,'#c9d4ee');
  x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=8;x.shadowOffsetY=3;
  x.fillStyle=g;x.fill();
  x.shadowColor='transparent';
  x.globalAlpha=.5;x.fillStyle='#ffffff';
  for(let i=0;i<w/6;i++){x.beginPath();x.arc(L+Math.random()*(R-L),top-6+Math.random()*16,Math.random()*1.4+.3,0,6.283);x.fill();}
  x.globalAlpha=1;
}
function paintDrift(){
  const cv=document.getElementById('drift');if(!cv)return;
  const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);
  const p1=Math.random()*6,p2=Math.random()*6,p3=Math.random()*6;
  const y=px=>38+Math.sin(px/110+p1)*9+Math.sin(px/47+p2)*5+Math.sin(px/230+p3)*10;
  x.beginPath();x.moveTo(0,h);x.lineTo(0,y(0));
  for(let px=0;px<=w;px+=6)x.lineTo(px,y(px));
  x.lineTo(w,h);x.closePath();
  const g=x.createLinearGradient(0,20,0,h);g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#e9eefb');g.addColorStop(1,'#c7d3ee');
  x.shadowColor='rgba(138,99,255,.35)';x.shadowBlur=22;x.shadowOffsetY=-4;
  x.fillStyle=g;x.fill();x.shadowColor='transparent';
  x.globalAlpha=.55;x.fillStyle='#ffffff';
  for(let i=0;i<w*h/160;i++){x.beginPath();x.arc(Math.random()*w,40+Math.random()*(h-40),Math.random()*1.6+.3,0,6.283);x.fill();}
  x.globalAlpha=1;
}
function render(){
  const t=i18n[lang];
  const q=document.getElementById('search').value.trim().toLowerCase();
  const grid=document.getElementById('grid');
  let html='',shown=0,i=0;
  rules.forEach(rule=>{
    const title=rule.tt[lang];
    const typeOK=activeFilter==='all'||rule.items.some(x=>x.type===activeFilter);
    const hit=q===''||title.toLowerCase().includes(q)||rule.items.some(x=>itemText(x).includes(q));
    if(!(typeOK&&hit))return;
    shown++;
    html+='<div class="rule-btn'+(i<12?' anim':'')+'" data-n="'+rule.num+'"'+(i<12?' style="animation-delay:'+(i*0.015).toFixed(3)+'s"':'')+'><span class="num">'+rule.num+'</span><i class="ico fa-solid '+rule.icon+'"></i><span class="ttl">'+title+'</span><canvas class="snowcap"></canvas></div>';i++;
  });
  grid.innerHTML=html;
  grid.querySelectorAll('.snowcap').forEach(paintSnow);
  const e=document.getElementById('empty');
  e.textContent=t.empty;e.style.display=shown?'none':'block';
}
document.getElementById('grid').addEventListener('click',e=>{
  const b=e.target.closest('.rule-btn');if(!b)return;
  const rule=rules.find(r=>r.num==b.dataset.n);if(rule)openModal(rule);
});

(function(){
  const grid=document.getElementById('grid');
  const last=new WeakMap();
  function erase(e){
    if(e.pointerType==='mouse'&&e.buttons===undefined)return;
    const card=e.target.closest&&e.target.closest('.rule-btn');
    if(!card){return;}
    const cv=card.querySelector('.snowcap');if(!cv)return;
    const r=cv.getBoundingClientRect();
    const sx=cv.width/r.width,sy=cv.height/r.height;
    const px=(e.clientX-r.left)*sx,py=(e.clientY-r.top)*sy;
    const x=cv.getContext('2d');
    x.save();x.globalCompositeOperation='destination-out';
    x.lineCap='round';x.lineJoin='round';x.lineWidth=30*sx;
    const l=last.get(cv);
    x.beginPath();
    if(l&&e.type!=='pointerdown'){x.moveTo(l[0],l[1]);x.lineTo(px,py);x.stroke();}
    else{x.arc(px,py,15*sx,0,6.283);x.fill();}
    x.restore();
    last.set(cv,[px,py]);
  }
  grid.addEventListener('pointermove',erase);
  grid.addEventListener('pointerdown',erase);
  grid.addEventListener('pointerleave',()=>{});
  grid.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.rule-btn');if(c){const cv=c.querySelector('.snowcap');if(cv&&!c.contains(e.relatedTarget))last.delete(cv);}});
})();

let itemObserver=null;
function openModal(rule,keep){
  curRule=rule;
  const t=i18n[lang];
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalTitle').textContent=rule.num+'. '+rule.tt[lang];
  const q=document.getElementById('search').value.trim().toLowerCase();
  const sectionHit=q===''||rule.tt[lang].toLowerCase().includes(q);
  let h='';
  rule.items.forEach(x=>{
    if(activeFilter!=='all'&&x.type!==activeFilter)return;
    if(!sectionHit&&!itemText(x).includes(q))return;
    h+='<div class="item"><h4>'+x.sub+'</h4><p>'+x.t[lang]+'</p>'
      +'<div class="expl"><span class="expl-label">'+t.expl+'</span><div class="expl-body">'+x.e[lang]+'</div></div>'
      +'<span class="penalty '+x.type+'">'+t.penalty+': '+x.p[lang]+'</span></div>';
  });
  const body=document.getElementById('modalBody');
  body.innerHTML=h;
  const scroller=document.querySelector('#modal .modal-scroll');
  if(!keep)scroller.scrollTop=0;
  if(itemObserver)itemObserver.disconnect();
  const items=[...body.querySelectorAll('.item')];
  if(keep||matchMedia('(prefers-reduced-motion:reduce)').matches||!('IntersectionObserver' in window)){
    items.forEach(it=>it.classList.add('in'));
  }else{
    itemObserver=new IntersectionObserver((entries,obs)=>{
      const vis=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
      vis.forEach((en,k)=>{en.target.style.animationDelay=(k*0.03).toFixed(2)+'s';en.target.classList.add('in');obs.unobserve(en.target);});
    },{root:scroller,threshold:0.04});
    requestAnimationFrame(()=>requestAnimationFrame(()=>items.forEach(it=>itemObserver.observe(it))));
  }
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  if(itemObserver){itemObserver.disconnect();itemObserver=null;}
  curRule=null;
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('filters').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');if(!chip)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');activeFilter=chip.dataset.f;
  positionPill();render();
});

function startSnow(c,dens,alpha){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const x=c.getContext('2d');
  let w,h,f=[];
  function mk(a){const r=Math.random()*2.4+1;return{x:Math.random()*w,y:a?Math.random()*h:-8,r:r,v:r*.3+.4,s:Math.random()*6.28,a:(Math.random()*.4+.45)*alpha}}
  function size(){const d=Math.min(devicePixelRatio||1,2);w=c.clientWidth||innerWidth;h=c.clientHeight||innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
    const n=Math.round(Math.min(dens,w/12));while(f.length<n)f.push(mk(true));f.length=n}
  function tick(){
    if(!document.hidden&&c.offsetParent!==null||c.id==='fx'){
      x.clearRect(0,0,w,h);
      for(const p of f){
        p.y+=p.v;p.s+=.012;p.x+=Math.sin(p.s)*.4;
        if(p.y>h+8)Object.assign(p,mk(false));
        x.globalAlpha=p.a;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle='#f2eeff';x.fill();
      }
    }
    requestAnimationFrame(tick);
  }
  addEventListener('resize',size);
  size();tick();
}
